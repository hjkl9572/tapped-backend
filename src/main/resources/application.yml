  spring:

    config:
      import: "optional:file:.env[.properties]"

    application:
      name: backend

    datasource:
      url: jdbc:postgresql://localhost:5432/tapped
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}

    jpa:
      open-in-view: false
      hibernate:
        ddl-auto: validate

    flyway:
      enabled: true

    security:
      oauth2:
        client:
          registration:
            google:
              client-id: ${GOOGLE_CLIENT_ID}
              client-secret: ${GOOGLE_CLIENT_SECRET}
              scope:
                - openid
                - profile
                - email